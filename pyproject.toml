[project]
name = "peff_digest"
version = "0.1.0"
description = "A short description of the project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "spxtacular",
    "pefftacular",
    "peff_uniprot_fetcher",
    "polars>=1.0",
    "pydantic>=2.0",
    "tqdm>=4.67.3",
]
authors = [
    { name = "Patrick Garrett", email = "pgarrett@scripps.edu" }
]
maintainers = [
    { name = "Patrick Garrett", email = "pgarrett@scripps.edu" }
]
classifiers = [
    # TODO
]

[project.scripts]
peff-digest = "peff_digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peff_digest"]

[tool.uv]
package = true
dev-dependencies = [
    "pytest>=9.0.2",
    "ruff>=0.14.11",
    "ty>=0.0.11",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]


[tool.uv.sources]
spxtacular = { path = "../spxtacular", editable = true }
pefftacular = { path = "../pefftacular", editable = true }
peff_uniprot_fetcher = { path = "../peff_uniprot_fetcher", editable = true }
