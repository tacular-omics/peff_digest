[project]
name = "peff_digest"
version = "0.2.0"
description = "PEFF-aware in-silico protein digestion with PTM enumeration, sequence variants, and ProForma output."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["proteomics", "PEFF", "peptide", "digestion", "PTM", "ProForma", "bioinformatics"]
dependencies = [
    "pefftacular>=1.0,<2",
    "peptacular>=4.2,<5",
    "polars>=1.0",
    "pydantic>=2.0",
    "tomli-w>=1.0",
    "tqdm>=4.67.3",
    "psimodpy>=1.0,<2",
    "unimodpy>=1.0,<2",
]
authors = [
    { name = "Patrick Garrett", email = "pgarrett@scripps.edu" }
]
maintainers = [
    { name = "Patrick Garrett", email = "pgarrett@scripps.edu" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.scripts]
peff-digest = "peff_digest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peff_digest"]

[tool.uv]
package = true
dev-dependencies = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.11",
    "ty>=0.0.11",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
