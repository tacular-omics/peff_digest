name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: peff_digest

      - uses: actions/checkout@v4
        with:
          repository: tacular-omics/spxtacular
          token: ${{ secrets.GITHUB_TOKEN }}
          path: spxtacular

      - uses: actions/checkout@v4
        with:
          repository: tacular-omics/pefftacular
          token: ${{ secrets.GITHUB_TOKEN }}
          path: pefftacular

      - uses: actions/checkout@v4
        with:
          repository: tacular-omics/peff_uniprot_fetcher
          token: ${{ secrets.GITHUB_TOKEN }}
          path: peff_uniprot_fetcher

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        working-directory: peff_digest
        run: uv sync

      - name: Lint
        working-directory: peff_digest
        run: uv run ruff check src/ tests/

      - name: Format check
        working-directory: peff_digest
        run: uv run ruff format --check src/ tests/

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: peff_digest

      - uses: actions/checkout@v4
        with:
          repository: tacular-omics/spxtacular
          token: ${{ secrets.GITHUB_TOKEN }}
          path: spxtacular

      - uses: actions/checkout@v4
        with:
          repository: tacular-omics/pefftacular
          token: ${{ secrets.GITHUB_TOKEN }}
          path: pefftacular

      - uses: actions/checkout@v4
        with:
          repository: tacular-omics/peff_uniprot_fetcher
          token: ${{ secrets.GITHUB_TOKEN }}
          path: peff_uniprot_fetcher

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install
        working-directory: peff_digest
        run: uv sync

      - name: Test
        working-directory: peff_digest
        run: uv run pytest tests/ -v
