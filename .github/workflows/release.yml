name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # required for PyPI trusted publishing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: peff_digest
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: tacular-omics/spxtacular
          token: ${{ secrets.GITHUB_TOKEN }}
          path: spxtacular

      - uses: actions/checkout@v4
        with:
          repository: tacular-omics/pefftacular
          token: ${{ secrets.GITHUB_TOKEN }}
          path: pefftacular

      - uses: actions/checkout@v4
        with:
          repository: tacular-omics/peff_uniprot_fetcher
          token: ${{ secrets.GITHUB_TOKEN }}
          path: peff_uniprot_fetcher

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build
        working-directory: peff_digest
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: peff_digest/dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
